name: 6win Auto Scraper

on:
  schedule:
    - cron: '*/5 * * * *'  # ၅ မိနစ်တစ်ခါ Auto-run မည်
  workflow_dispatch:        # Manual နှိပ်၍ Run နိုင်ရန်

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Code ယူခြင်း
        uses: actions/checkout@v3

      - name: Python Setup လုပ်ခြင်း
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Library များ Install လုပ်ခြင်း
        run: pip install -r requirements.txt

      - name: Scraper မောင်းနှင်ခြင်း
        run: python main.py
