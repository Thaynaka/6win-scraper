name: 6win Auto Scraper

on:
  schedule:
    - cron: '*/5 * * * *' # ၅ မိနစ်တစ်ခါ Auto Run မည်
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper
        run: python main.py
